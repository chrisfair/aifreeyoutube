<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Shield Glow Filter -->
  <path d="M256 96 C336 96 384 128 384 128 C384 272 320 368 256 416 C192 368 128 272 128 128 C128 128 176 96 256 96 Z"
        fill="none" stroke="#10b981" stroke-width="12" filter="url(#glow)" opacity="0.4"/>

  <!-- Shield Body -->
  <path d="M256 96 C336 96 384 128 384 128 C384 272 320 368 256 416 C192 368 128 272 128 128 C128 128 176 96 256 96 Z"
        fill="url(#shieldGrad)" stroke="url(#accentGrad)" stroke-width="12" stroke-linejoin="round"/>

  <!-- Authentic Human Checkmark & Play Triangle Composite -->
  <!-- Play Icon Triangle -->
  <polygon points="230,196 322,256 230,316" fill="url(#accentGrad)" opacity="0.95"/>

  <!-- Protective Human Star / Sparkle in Top Corner -->
  <circle cx="256" cy="148" r="6" fill="#34d399"/>
</svg>
